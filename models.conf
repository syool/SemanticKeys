# models.conf — Single source of truth for model identity and serving parameters.
#
# Sourced by scripts/serve.sh, scripts/run.sh, scripts/dryrun.sh, and
# scripts/bundle_create.sh. Edit here only.
#
# ---------------------------------------------------------------------------
# VERIFICATION STATUS
# ---------------------------------------------------------------------------
# Repository IDs below were verified against huggingface.co in August 2026.
# Model catalogs change; run `python3 src/verify_models.py` before a long
# download to confirm each repo still exists, is accessible with your token,
# and reports the size you expect.
#
# ---------------------------------------------------------------------------
# NOTES THAT AFFECT SERVING CHOICES
# ---------------------------------------------------------------------------
# * Gemma 4 31B is ~30.7B parameters and ~62.5 GB in bf16. That does NOT fit
#   on a 48 GB L40S. Use the QAT w4a16 compressed-tensors checkpoint, which
#   Google publishes specifically for optimized vLLM inference and which
#   preserves quality substantially better than post-hoc quantization.
#
# * Both Qwen 3.5/3.6 27B and Gemma 4 are multimodal (vision-language). We
#   use them text-only. This is fine, but state it in the paper — a reviewer
#   may otherwise wonder whether visual pretraining is doing something.
#
# * Both families ship configurable "thinking" modes. Reasoning traces would
#   inflate output token counts and confound Experiment 1's compression
#   measurement. Thinking is disabled by default below; see THINKING_OFF_ARGS.
#
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CONCURRENCY
# ---------------------------------------------------------------------------
# vLLM defaults max_num_seqs to 256. Our runner issues requests sequentially,
# so concurrency beyond a handful buys nothing — it just reserves memory.
#
# On hybrid Mamba/SSM models (Qwen 3.5 is one) that reservation is fatal
# rather than merely wasteful: each in-flight decode sequence needs its own
# Mamba state-cache block, and if max_num_seqs exceeds the number of blocks
# that fit in VRAM, engine startup aborts during CUDA graph capture with
#   "max_num_seqs (256) exceeds available Mamba cache blocks (N)"
#
# 64 leaves generous headroom for a sequential workload while staying well
# under the block budget on a 48 GB card. Raise it only if you parallelise
# the runner, and re-check the block count if you do.
MAX_NUM_SEQS_DEFAULT=64

# --- Qwen (choose one generation) ------------------------------------------
# Qwen3.5-27B is the generation contemporaneous with Gemma 4.
# Qwen3.6-27B is newer with agentic-coding improvements. Either is defensible;
# pick one and keep it fixed across all runs.
#
# Note: this is a hybrid Mamba/attention model, not a pure Transformer. That
# affects the concurrency ceiling (see MAX_NUM_SEQS_DEFAULT above) and is
# worth stating in the paper, since architecture is a plausible moderator of
# any protocol effect we observe.
QWEN_REPO="Qwen/Qwen3.5-27B"
QWEN_LOCAL_DIR="Qwen3.5-27B"
QWEN_MAX_LEN=16384
# bf16 at 27B is ~54 GB — too tight on 48 GB with KV cache. FP8 fits well.
QWEN_QUANT="--quantization=fp8"
QWEN_APPROX_GB=54

# Newer alternative, uncomment to switch:
# QWEN_REPO="Qwen/Qwen3.6-27B"
# QWEN_LOCAL_DIR="Qwen3.6-27B"

# --- Gemma 4 31B dense -----------------------------------------------------
# QAT w4a16 compressed-tensors: published by Google for native vLLM inference.
# Fits comfortably on 48 GB and avoids the quality loss of post-hoc PTQ.
GEMMA_REPO="google/gemma-4-31B-it-qat-w4a16-ct"
GEMMA_LOCAL_DIR="gemma-4-31B-it-qat-w4a16-ct"
GEMMA_MAX_LEN=16384
GEMMA_QUANT=""          # quantization is baked into the checkpoint
GEMMA_APPROX_GB=18

# Full-precision variant, if you have >64 GB VRAM:
# GEMMA_REPO="google/gemma-4-31B-it"
# GEMMA_LOCAL_DIR="gemma-4-31B-it"
# GEMMA_QUANT="--quantization=fp8"
# GEMMA_APPROX_GB=62

# --- Gemma 4 26B-A4B MoE (fast alternative) --------------------------------
# 4B active parameters — runs roughly as fast as a 4B dense model. Useful for
# rapid iteration during development.
GEMMA_MOE_REPO="google/gemma-4-26B-A4B-it"
GEMMA_MOE_LOCAL_DIR="gemma-4-26B-A4B-it"
GEMMA_MOE_MAX_LEN=32768
GEMMA_MOE_QUANT=""
GEMMA_MOE_APPROX_GB=52

# --- Gemma 4 scale ladder ---------------------------------------------------
# Same family, three sizes, for asking how the cost gap and any accuracy effect
# move with capacity. Gemma rather than Qwen so the architecture is held fixed
# across the ladder, and to avoid Qwen's reasoning-token behaviour at the small
# end where it is hardest to suppress reliably.
#
# PRECISION IS NOT UNIFORM. Google publishes QAT w4a16 checkpoints for 12B and
# 31B but not for E4B, which therefore runs in bf16. Full precision favours the
# smallest model, so treat its accuracy as an upper bound and say so in the
# paper. Token counts — the measurement this ladder exists for — are unaffected
# by precision.
GEMMA_E4B_REPO="google/gemma-4-E4B-it"
GEMMA_E4B_LOCAL_DIR="gemma-4-E4B-it"
GEMMA_E4B_MAX_LEN=16384
GEMMA_E4B_QUANT=""          # no QAT checkpoint published; bf16
GEMMA_E4B_APPROX_GB=10

GEMMA_12B_REPO="google/gemma-4-12B-it-qat-w4a16-ct"
GEMMA_12B_LOCAL_DIR="gemma-4-12B-it-qat-w4a16-ct"
GEMMA_12B_MAX_LEN=16384
GEMMA_12B_QUANT=""          # quantization baked into the checkpoint
GEMMA_12B_APPROX_GB=8

# --- Small model for dry runs ----------------------------------------------
# Used by online_dryrun.sh to exercise the whole pipeline in minutes rather
# than hours. Not for paper numbers.
DRYRUN_REPO="Qwen/Qwen3-4B-Instruct-2507"
DRYRUN_LOCAL_DIR="Qwen3-4B-Instruct-2507"
DRYRUN_MAX_LEN=8192
DRYRUN_QUANT=""
DRYRUN_APPROX_GB=8

# --- Embedder --------------------------------------------------------------
EMBEDDER_REPO="sentence-transformers/all-mpnet-base-v2"
EMBEDDER_LOCAL_DIR="all-mpnet-base-v2"
EMBEDDER_APPROX_GB=1

# --- Shared serving parameters ---------------------------------------------
VLLM_PORT_DEFAULT=8000
VLLM_HOST_DEFAULT="0.0.0.0"
VLLM_GPU_UTIL_DEFAULT=0.90
# Structured-output backend used to constrain verifier verdicts. The flag
# controlling this has changed name across vLLM releases, and on recent
# builds xgrammar is already the default. serve.sh probes `vllm serve --help`
# and passes a flag only if the installed version accepts one, so this value
# is a preference rather than a requirement — an unsupported build simply
# uses its own default and run.sh smoke-tests that guided decoding works.
VLLM_GUIDED_BACKEND_DEFAULT="xgrammar"

# Disable built-in reasoning/thinking so that output token counts reflect the
# communication protocol rather than hidden chain-of-thought. Applied to all
# main-experiment serving. If a model ignores these, check its model card for
# the current flag name and update here.
THINKING_OFF_ARGS="--reasoning-parser deepseek_r1"
# NOTE: the flag above only *parses* reasoning into a separate field; it does
# not suppress it. For Qwen, thinking is controlled per-request via the chat
# template. See sk/client.py:OpenAICompatibleClient extra_body, which
# sets chat_template_kwargs={"enable_thinking": false}. Verify on your
# model with online_dryrun.sh, which reports whether reasoning tokens appear.

# --- Dataset ---------------------------------------------------------------
HOTPOTQA_HF_REPO="hotpot_qa"
HOTPOTQA_HF_CONFIG="distractor"
HOTPOTQA_HF_SPLIT="validation"
HOTPOTQA_LOCAL_FILE="hotpot_dev_distractor_v1.json"